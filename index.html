  <script>
    // custom chisel cursor :3
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });

    // draggable photos code needs debugging
    document.querySelectorAll('.photo').forEach(photo => {
      photo.addEventListener('mousedown', e => {
        e.preventDefault();
        const rect = photo.getBoundingClientRect();
        photo.style.top  = rect.top  + window.scrollY + 'px';
        photo.style.left = rect.left + 'px';
        const offsetX = e.clientX - rect.left;
        const offsetY = e.clientY - rect.top;

        photo.style.zIndex = 10; // bring to front over title

        const onMove = e => {
          photo.style.left = (e.clientX - offsetX) + 'px';
          photo.style.top  = (e.clientY - offsetY) + 'px';
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', () => {
          document.removeEventListener('mousemove', onMove);
          photo.style.zIndex = 2;
        }, { once: true });
      });
    });

  // ticket tape poetry from old website
const lines = [
  "I am going walking among the various intersecting planes",
"I am going wandering around the city and then around the countryside",
"We gravitate towards nodes",
"I am centred around stones",
"In the centre of my sternum there is a tattoo of a spiral",
"Like the eroded finger-marks of cup-and-ring-marks, broken lines",
"My heart beats under it",
"I hold the land close when i get to a node",
"Walking from one fork to another",
"Walking from one junction to another",
"Walking from one branching intersection to another",
"This land is knit together by stones",
"Mud-slip up the hill, the land is a body",
"The land is a body",
"The land is a body"
];

// below stuff is a load of js to get it to look like its typing
const el = document.getElementById('ticker-text');
let lineIndex = 0;
let charIndex = 0;
let deleting = false;

function type() {
  const current = lines[lineIndex];

  if (!deleting) {
    el.textContent = current.slice(0, charIndex + 1);
    charIndex++;
    if (charIndex === current.length) {
      deleting = true;
      setTimeout(type, 1800);
      return;
    }
    setTimeout(type, 55);
  } else {
    el.textContent = current.slice(0, charIndex - 1);
    charIndex--;
    if (charIndex === 0) {
      deleting = false;
      lineIndex = (lineIndex + 1) % lines.length;
      setTimeout(type, 400);
      return;
    }
    setTimeout(type, 28);
  }
}

type();

  </script>
